[project]
name = "wedding-planner-multiagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdalaye-s", email = "abdalaye.soum.as@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.14",
    "mcp>=1.30.0",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[project.scripts]
wedding-planner-multiagent = "wedding_planner_multiagent:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
